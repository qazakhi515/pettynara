name: CI

on:
  push:
    branches: [petty-mod, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep the in-memory MongoDB binary outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as the Docker image
          cache: npm

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-6.0.14

      - run: npm ci
      - run: npm run build

      # The app runs with or without Redis, so both modes are tested.
      - name: Test without Redis
        run: npm test
      - name: Test with Redis
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
