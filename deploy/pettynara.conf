# /etc/nginx/conf.d/pettynara.conf
#
# medi-care.conf bilan bir xil uslub: frontend va api alohida subdomen,
# ikkalasi ham localhost'dagi konteynerga uzatiladi.
#
# FAQAT 80-port yozilgan. certbot --nginx ishga tushirilganda 443 bloklarini,
# sertifikat yo'llarini va 80 -> 443 redirect'ini O'ZI qo'shadi.

# ---------- Frontend: React (konteyner 4004) ----------
server {
    listen 80;
    server_name pettynara.uz www.pettynara.uz;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4004/;
    }
}

# ---------- API + admin panel: Express (konteyner 4005) ----------
server {
    listen 80;
    server_name api.pettynara.uz;

    # multer'da fayl hajmi cheklanmagan — chegarani nginx qo'yadi.
    # Busiz katta rasm yuklashda 413 xatosi chiqadi.
    client_max_body_size 20M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4005/;
    }

    # Admin panel (EJS) — faqat sizning IP'ingizdan.
    # Bu eng zaif nuqta, internetga ochiq qoldirilmaydi.
    location /admin {
        allow 211.36.152.26;   # sizning hozirgi public IP'ingiz
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4005;
    }
}
