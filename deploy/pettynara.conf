# /etc/nginx/conf.d/pettynara.conf
#
# medi-care.conf bilan bir xil uslub: frontend va api alohida subdomen,
# ikkalasi ham localhost'dagi konteynerga uzatiladi.
#
# FAQAT 80-port yozilgan. certbot --nginx ishga tushirilganda 443 bloklarini,
# sertifikat yo'llarini va 80 -> 443 redirect'ini O'ZI qo'shadi.
#
# DIQQAT — serverda certbot bu faylni allaqachon o'zgartirgan: har bir server
# blokiga "listen 443 ssl" va sertifikat qatorlari qo'shilgan, hamda 80 -> 443
# redirect bloklari yaratilgan. Ya'ni serverdagi fayl shu fayldan uzunroq.
# Qo'lda tahrirlaganda HTTPS (443) blokidagi location'ni o'zgartirish kerak —
# brauzer https orqali kiradi.

# ---------- Frontend: React (konteyner 4004) ----------
server {
    listen 80;
    server_name pettynara.uz www.pettynara.uz;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4004/;
    }
}

# ---------- API + admin panel: Express (konteyner 4005) ----------
server {
    listen 80;
    server_name api.pettynara.uz;

    # multer'da fayl hajmi cheklanmagan — chegarani nginx qo'yadi.
    # Busiz katta rasm yuklashda 413 xatosi chiqadi.
    client_max_body_size 20M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4005/;
    }

    # Admin panel (EJS) — internetga ochiq qoldirilmaydi.
    #
    # Avval "allow <IP>; deny all;" ishlatilgan edi, lekin uy internetida
    # public IP dinamik: har o'zgarganda o'zimiz ham 403 olardik va har safar
    # serverga kirib configni tahrirlashga to'g'ri kelardi. Shuning uchun
    # IP o'rniga parol (HTTP Basic) qo'yildi — qayerdan kirilsa ham ishlaydi.
    #
    # Parol faylini bir marta yaratish kerak:
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd admin
    #
    # Bu Express'ning o'z admin login sahifasidan ALOHIDA qavat:
    # avval nginx paroli, keyin panelning o'z login formasi.
    location /admin {
        auth_basic           "Pettynara Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4005;
    }
}
