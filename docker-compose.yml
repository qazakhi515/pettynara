services:
  backend:
    build: .
    container_name: pettynara-backend
    restart: unless-stopped

    # Sirlar (MONGO_URL, SESSION_SECRET, SECRET_TOKEN) image ichida emas,
    # tashqaridagi .env faylidan o'qiladi.
    env_file: .env

    # DIQQAT — "127.0.0.1:" prefiksi MAJBURIY.
    # Oddiy "3003:3003" yozilsa, Docker o'z iptables qoidalarini UFW dan
    # oldin qo'yadi va portni butun internetga ochib qo'yadi. Bunda esa
    # port faqat serverning o'zidan ko'rinadi — tashqariga nginx chiqaradi.
    # Tashqarida 4005 (server konventsiyasi), konteyner ichida esa 3003 —
    # ya'ni backend kodiga va .env dagi PORT=3003 ga tegilmaydi.
    ports:
      - "127.0.0.1:4005:3003"

    # Yuklangan rasmlar konteyner ichida emas, host diskida saqlanadi.
    # Aks holda har "docker compose up --build" da 102MB rasm yo'qolardi.
    volumes:
      - ./uploads:/app/uploads

    # .env da REDIS_URL=redis://redis:6379 bo'lishi kerak: "redis" — pastdagi
    # xizmat nomi, Docker tarmog'i uni o'zi manzilga aylantiradi.
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: pettynara-redis
    restart: unless-stopped
    # 64 MB yetarli: rate limit hisoblagichlari, 60 soniyalik kesh va admin
    # session'lari. Hammasining TTL'i bor, xotira to'lsa avval eng eski
    # TTL'li kalitlar o'chiriladi (volatile-lru).
    command: redis-server --maxmemory 64mb --maxmemory-policy volatile-lru
    # "ports:" ataylab YO'Q. Redis parolsiz ishlaydi, shuning uchun u na
    # internetga, na serverning o'ziga ochiladi — faqat backend konteyneri
    # Docker tarmog'i ichida ulana oladi.
    volumes:
      - redis-data:/data

volumes:
  # Redis restart bo'lganda ham admin session'lari va hisoblagichlar saqlanadi.
  redis-data:
